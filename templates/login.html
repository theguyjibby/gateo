<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Gateo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Material Icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        'primary-container': '#4c1d95',
                        'on-primary': '#ffffff',
                        secondary: '#8b5cf6',
                        'secondary-container': '#5b21b6',
                        surface: '#ffffff',
                        'surface-variant': '#f3f4f6',
                        'surface-container': '#f8fafc',
                        'surface-container-high': '#e2e8f0',
                        'surface-container-highest': '#cbd5e1',
                        'on-surface': '#0f172a',
                        'on-surface-variant': '#475569',
                        outline: '#94a3b8',
                        'outline-variant': '#cbd5e1',
                        error: '#ef4444',
                        'error-container': '#fef2f2',
                        'on-error-container': '#991b1b'
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-surface-container min-h-screen flex items-center justify-center p-4">
    <!-- Floating Decor Gradients -->
    <div
        class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px] -z-10 pointer-events-none">
    </div>
    <div
        class="fixed bottom-[-10%] right-[-5%] w-[400px] h-[400px] bg-secondary/10 rounded-full blur-[100px] -z-10 pointer-events-none">
    </div>

    <div
        class="bg-surface rounded-[2rem] w-full max-w-md shadow-2xl relative overflow-hidden border border-outline-variant/10">
        <!-- Header -->
        <div class="px-8 pt-8 pb-6 flex items-center justify-center border-b border-outline-variant/10">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center shadow-md shadow-primary/20">
                    <span class="material-symbols-outlined text-white"
                        style="font-variation-settings: 'FILL' 1;">dashboard</span>
                </div>
                <span class="font-headline font-extrabold text-2xl tracking-tighter text-on-surface">Gateo</span>
            </div>
        </div>

        <div class="p-8">
            <h1 class="text-2xl font-bold font-headline text-center text-on-surface mb-2">Welcome Back</h1>
            <p class="text-on-surface-variant text-center font-body text-sm mb-8">Sign in to manage your events and
                tickets.</p>

            <!-- Message Banner -->
            <div id="authMessage" class="hidden mb-6 p-4 rounded-xl text-sm font-medium font-body border"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5" onsubmit="handleAuth(event)">
                <div>
                    <label class="block text-sm font-bold font-headline text-on-surface mb-2">Email Address</label>
                    <input type="email" name="email" required
                        class="w-full bg-surface-container border-none ring-1 ring-outline-variant/30 focus:ring-primary rounded-xl px-4 py-3.5 text-sm font-body text-on-surface placeholder:text-on-surface-variant/50 transition-shadow outline-none"
                        placeholder="you@example.com">
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-bold font-headline text-on-surface">Password</label>
                        <a href="#" class="text-xs font-bold text-primary hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" name="password" required
                        class="w-full bg-surface-container border-none ring-1 ring-outline-variant/30 focus:ring-primary rounded-xl px-4 py-3.5 text-sm font-body text-on-surface placeholder:text-on-surface-variant/50 transition-shadow outline-none"
                        placeholder="••••••••">
                </div>
                <button type="submit"
                    class="w-full py-4 bg-on-surface text-surface rounded-xl font-headline font-bold text-sm shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all duration-200 mt-4">Sign
                    In</button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-8">
                <div class="flex-1 h-px bg-outline-variant/30"></div>
                <span class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">or continue with</span>
                <div class="flex-1 h-px bg-outline-variant/30"></div>
            </div>

            <a href="/login/google"
                class="w-full py-3.5 bg-surface border border-outline-variant/30 text-on-surface rounded-xl font-headline font-bold text-sm flex items-center justify-center gap-3 hover:bg-surface-container transition-colors active:scale-95 duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Google
            </a>

            <!-- Footer Toggles -->
            <div class="mt-8 text-center pt-6 border-t border-outline-variant/10">
                <p class="text-sm text-on-surface-variant font-body">Don't have an account? <a href="/register"
                        class="text-primary font-bold hover:underline font-headline ml-1">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script>
        const authMessage = document.getElementById('authMessage');

        function showMessage(msg, isError) {
            authMessage.innerText = msg;
            authMessage.classList.remove('hidden');
            if (isError) {
                authMessage.classList.add('bg-error-container', 'text-on-error-container', 'border-error/20');
                authMessage.classList.remove('bg-surface-container-highest', 'text-on-surface');
            } else {
                authMessage.classList.remove('bg-error-container', 'text-on-error-container', 'border-error/20');
                authMessage.classList.add('bg-surface-container-highest', 'text-on-surface', 'border-outline-variant/20');
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            authMessage.classList.add('hidden');

            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Signing in...';
            submitBtn.disabled = true;

            let response;
            try {
                response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const result = await response.json();
                    if (response.ok) {
                        window.location.href = '/dashboard';
                        return;
                    } else {
                        showMessage(result.message || 'Invalid email or password.', true);
                    }
                } else {
                    const text = await response.text();
                    console.error("Backend Error Response (HTML):", text);
                    
                    const titleMatch = text.match(/<title>(.*?)<\/title>/i);
                    const pMatch = text.match(/<p>(.*?)<\/p>/i);
                    let errorDesc = `Server Error (${response.status}).`;
                    if (titleMatch) errorDesc += " " + titleMatch[1];
                    if (pMatch) errorDesc += " - " + pMatch[1];
                    
                    showMessage(`Backend Error: ${errorDesc}. Check terminal for details.`, true);
                }
            } catch (err) {
                showMessage(`Connection Error: ${err.message}. Is your Flask server running?`, true);
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
