<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Expired - Gateo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        'primary-container': '#ede9fe',
                        secondary: '#8b5cf6',
                        surface: '#ffffff',
                        'surface-container': '#f8fafc',
                        'surface-container-low': '#f1f5f9',
                        'surface-container-highest': '#e2e8f0',
                        'on-surface': '#0f172a',
                        'on-surface-variant': '#475569',
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-surface-container min-h-screen text-on-surface font-body flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-8">
        <div class="bg-surface border border-outline-variant/20 rounded-2xl p-8 text-center">
            <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-red-500 text-3xl">link_off</span>
            </div>
            <h1 class="text-2xl font-extrabold font-headline text-on-surface mb-3">Link Unavailable</h1>
            <p class="text-on-surface-variant text-sm mb-8">{{ message }}</p>
            <a href="/cashier"
                class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-br from-primary to-primary-container text-white rounded-lg font-headline font-bold text-sm shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-95 transition-all">
                <span class="material-symbols-outlined text-lg">arrow_back</span>
                Back to Cashier
            </a>
        </div>
    </div>
</body>

</html>
