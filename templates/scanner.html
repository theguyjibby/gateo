<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - {{ event.event_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        'primary-container': '#4c1d95',
                        surface: '#1e293b',
                        'surface-container': '#0f172a',
                        'on-surface': '#f8fafc',
                        'on-surface-variant': '#94a3b8',
                        outline: '#334155'
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container text-on-surface font-body h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-surface/50 backdrop-blur-md z-10">
        <div class="flex items-center gap-3">
            {% if back_url %}
            <a href="{{ back_url }}" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-white/10 transition-colors border border-outline text-white">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            {% endif %}
            <div>
                <h1 class="font-bold font-headline leading-tight">Ticket Scanner</h1>
                <p class="text-xs text-on-surface-variant">{{ event.event_name }}</p>
            </div>
        </div>
        <div class="flex items-center gap-2 text-xs font-bold bg-surface px-3 py-1.5 rounded-full border border-outline">
            <span class="material-symbols-outlined text-[16px] text-green-400">lens</span> Live
        </div>
    </header>

    <!-- Main Scanner Area -->
    <main class="flex-1 relative flex flex-col items-center justify-center p-4">
        <!-- Camera Viewfinder -->
        <div id="reader-container" class="w-full max-w-sm aspect-square bg-surface rounded-[32px] overflow-hidden border border-outline shadow-2xl relative">
            <div id="reader" class="w-full h-full"></div>
            <!-- Empty state mask briefly shown during load -->
            <div id="camera-loading" class="absolute inset-0 bg-surface flex flex-col items-center justify-center z-10">
                <span class="material-symbols-outlined animate-spin text-primary text-4xl mb-4">refresh</span>
                <p class="text-sm text-on-surface-variant font-bold animate-pulse">Accessing Camera...</p>
            </div>
        </div>

        <!-- Result Overlay -->
        <div id="resultCard" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-sm bg-surface rounded-3xl p-6 shadow-2xl border border-outline z-50 transform scale-95 opacity-0 pointer-events-none transition-all duration-300">
            <div class="text-center">
                <div id="resultIcon" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl text-white"></div>
                <h2 id="resultTitle" class="text-2xl font-extrabold font-headline mb-1"></h2>
                <p id="resultMsg" class="text-on-surface-variant text-sm mb-6"></p>
                
                <div id="ticketDetails" class="bg-surface-container rounded-2xl p-4 text-left hidden mb-6 border border-outline/50">
                    <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest mb-1">Guest Name</p>
                    <p id="guestName" class="font-bold text-lg mb-3"></p>
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest mb-1">Ticket Type</p>
                            <span id="guestType" class="px-2 py-1 bg-primary/20 text-primary text-[10px] font-black rounded uppercase tracking-wider"></span>
                        </div>
                    </div>
                </div>

                <button onclick="resumeScanning()" class="w-full py-4 bg-primary text-white rounded-xl font-bold font-headline shadow-lg hover:bg-primary-container transition-colors">
                    Close & Resume Scan
                </button>
            </div>
        </div>


    </main>

    <script>
        const html5QrcodeScanner = new Html5Qrcode("reader");
        const loadingOverlay = document.getElementById('camera-loading');
        const resultCard = document.getElementById('resultCard');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMsg = document.getElementById('resultMsg');
        const ticketDetails = document.getElementById('ticketDetails');
        const guestName = document.getElementById('guestName');
        const guestType = document.getElementById('guestType');

        let isProcessing = false;
        const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            html5QrcodeScanner.pause();
            await processTicket(decodedText);
        }

        async function processTicket(code) {
            try {
                const res = await fetch(`/api/verify_ticket/{{ event.event_id }}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_code: code.trim() })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showResult("success", "Valid Ticket", "Successfully checked in!", data);
                } else {
                    let errTitle = "Invalid Ticket";
                    if (data.message.includes("used")) errTitle = "Already Used";
                    showResult("error", errTitle, data.message, null);
                }
            } catch (err) {
                showResult("error", "Error", "Connection failed. Please try again.", null);
            }
        }

        function showResult(type, title, msg, data) {
            // Setup card content
            resultTitle.innerText = title;
            resultMsg.innerText = msg;
            
            if (type === 'success') {
                resultIcon.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl text-white bg-green-500 shadow-lg shadow-green-500/30";
                resultIcon.innerHTML = '<span class="material-symbols-outlined" style="font-size: 40px">check</span>';
                
                if (data && data.ticket_name) {
                    guestName.innerText = data.ticket_name;
                    guestType.innerText = data.ticket_type;
                    ticketDetails.classList.remove('hidden');
                }
            } else {
                resultIcon.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 text-4xl text-white bg-error shadow-lg shadow-error/30";
                resultIcon.innerHTML = '<span class="material-symbols-outlined" style="font-size: 40px">close</span>';
                ticketDetails.classList.add('hidden');
            }

            // Animate in
            resultCard.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
        }

        function resumeScanning() {
            // Animate out
            resultCard.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            
            setTimeout(() => {
                isProcessing = false;
                try {
                    html5QrcodeScanner.resume();
                } catch(e) {
                    startCamera();
                }
            }, 300);
        }



        function startCamera() {
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).then(() => {
                loadingOverlay.classList.add('opacity-0');
                setTimeout(() => loadingOverlay.style.display = 'none', 300);
            }).catch(err => {
                console.error(err);
                loadingOverlay.innerHTML = `
                    <div class="text-center p-6 space-y-4">
                        <span class="material-symbols-outlined text-error text-4xl">no_photography</span>
                        <p class="text-sm font-bold text-error">Camera Access Denied</p>
                        <p class="text-xs text-on-surface-variant">Please allow camera permissions and reload.</p>
                    </div>`;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
