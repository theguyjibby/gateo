<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Refund - {{ event.event_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed',
                        'primary-container': '#4c1d95',
                        'on-primary': '#ffffff',
                        secondary: '#8b5cf6',
                        surface: '#ffffff',
                        'surface-variant': '#f3f4f6',
                        'surface-container': '#f8fafc',
                        'surface-container-highest': '#cbd5e1',
                        'on-surface': '#0f172a',
                        'on-surface-variant': '#475569',
                        outline: '#94a3b8',
                        'outline-variant': '#cbd5e1',
                        error: '#ef4444',
                        'error-container': '#fef2f2',
                        'on-error-container': '#991b1b'
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-surface-container min-h-screen text-on-surface font-body p-6">
    <div class="max-w-xl mx-auto mt-12">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold font-headline mb-2 text-on-surface">Request a Refund</h1>
            <p class="text-on-surface-variant">{{ event.event_name }}</p>
        </div>

        <!-- Form Card -->
        <div class="bg-surface rounded-2xl shadow-xl shadow-slate-200/50 border border-outline-variant/30 p-8">
            <div id="formMessage" class="hidden mb-6 p-4 rounded-xl text-sm font-medium font-body border"></div>

            <!-- Info Banner -->
            <div class="mb-6 p-4 rounded-xl bg-blue-50 border border-blue-200 flex items-start gap-3">
                <span class="material-symbols-outlined text-blue-600 mt-0.5">info</span>
                <div>
                    <p class="text-sm font-bold font-headline text-blue-800">Refund Deadline</p>
                    <p class="text-xs text-blue-700 mt-1">You can request a refund until <strong>{{ window_end.strftime('%B %d, %Y') }}</strong>. After this date, refund requests will no longer be accepted.</p>
                </div>
            </div>

            <form id="refundForm" class="space-y-6" onsubmit="handleRefund(event, '{{ event.event_slug }}')">
                <div>
                    <label class="block text-sm font-bold font-headline text-on-surface mb-2">Email used for purchase</label>
                    <input type="email" name="email" required placeholder="you@example.com"
                        class="w-full bg-surface-container border-none ring-1 ring-outline-variant/50 focus:ring-primary rounded-xl px-4 py-3 text-sm text-on-surface transition-shadow outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold font-headline text-on-surface mb-2">Ticket ID</label>
                    <input type="text" name="ticket_unique_id" required placeholder="e.g. abc123xyz"
                        class="w-full bg-surface-container border-none ring-1 ring-outline-variant/50 focus:ring-primary rounded-xl px-4 py-3 text-sm text-on-surface transition-shadow outline-none">
                    <p class="text-xs text-on-surface-variant mt-1">You can find this in your ticket confirmation email.</p>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit"
                        class="px-8 py-4 bg-gradient-to-br from-error to-red-600 text-white rounded-xl font-headline font-bold text-sm shadow-xl shadow-error/20 hover:-translate-y-0.5 active:scale-95 transition-all flex items-center gap-2">
                        Request Refund
                        <span class="material-symbols-outlined text-lg">money_off</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formMessage = document.getElementById('formMessage');

        function showMessage(msg, isError) {
            formMessage.innerText = msg;
            formMessage.classList.remove('hidden');
            if (isError) {
                formMessage.classList.add('bg-error-container', 'text-on-error-container', 'border-error/20');
                formMessage.classList.remove('bg-surface-container-highest', 'text-on-surface');
            } else {
                formMessage.classList.remove('bg-error-container', 'text-on-error-container', 'border-error/20');
                formMessage.classList.add('bg-surface-container-highest', 'text-on-surface', 'border-outline-variant/20');
            }
        }

        async function handleRefund(e, eventSlug) {
            e.preventDefault();
            formMessage.classList.add('hidden');

            const form = e.target;
            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());

            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerText = 'Processing...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`/event/${eventSlug}/request-refund`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok) {
                    showMessage(result.message, false);
                    form.reset();
                } else {
                    showMessage(result.message || 'An error occurred.', true);
                }
            } catch (err) {
                showMessage(`Connection Error: ${err.message}`, true);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
